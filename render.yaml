services:
  - type: web
    name: wm-canteen
    runtime: docker
    branch: main
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ORDER_PIN
        sync: false
      - key: KITCHEN_PIN
        sync: false
      - key: ADMIN_PIN
        sync: false
