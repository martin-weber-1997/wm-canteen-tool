<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Canteen — Kitchen</title>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/kitchen.css">
  <script src="/theme.js"></script>
</head>
<body>
  <div class="kitchen-layout">
    <div class="header">
      <h1>Kitchen</h1>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="nav-switcher">
          <button class="btn btn-outline btn-sm nav-switcher-toggle" id="nav-toggle">Switch View</button>
          <div class="nav-switcher-menu" id="nav-menu">
            <a href="/order">Order</a>
            <a href="/kitchen" class="active">Kitchen</a>
            <a href="/admin">Admin</a>
          </div>
        </div>
        <button class="btn btn-outline btn-sm" id="theme-toggle">Dark</button>
        <button class="btn btn-outline btn-sm" id="toggle-done-btn">Hide Done</button>
        <button class="btn btn-outline btn-sm" id="logout-btn">Logout</button>
      </div>
    </div>

    <div class="kitchen-filter-bar" id="filter-bar"></div>

    <div class="kitchen-body">
      <div class="kitchen-col pending-col">
        <div class="col-header">
          Pending <span class="count-badge" id="pending-count">0</span>
        </div>
        <div class="col-body" id="pending-orders"></div>
      </div>

      <div class="kitchen-col done-col">
        <div class="col-header">
          Done <span class="count-badge" id="done-count">0</span>
        </div>
        <div class="col-body" id="done-orders"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/config.js"></script>
  <script src="/kitchen.js"></script>
</body>
</html>
